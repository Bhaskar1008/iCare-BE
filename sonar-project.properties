# Project Information
sonar.projectKey=salesverse-be
sonar.projectName=Salesverse Backend
sonar.projectVersion=1.0.0

# SonarQube Server Configuration
sonar.host.url=http://47.128.201.161:9000
sonar.token=sqp_a74f9ca8d35a60b62b60451b6bb9f2aae63a1895

# Source Code Configuration
sonar.sources=src
sonar.tests=tests

# Language Configuration
sonar.language=ts
sonar.typescript.node=node

# File Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/logs/**,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/jest.config.ts,\
  **/commitlint.config.mjs,\
  **/eslint.config.mjs,\
  src/index.ts,\
  src/app.ts,\
  **/*.d.ts,\
  **/reference/**,\
  **/scripts/**,\
  **/docs/**

# Test File Inclusions
sonar.test.inclusions=\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.spec.ts

# Test File Exclusions
sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**

# Coverage Configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  src/index.ts,\
  src/app.ts,\
  **/*.config.ts,\
  **/*.routes.ts,\
  **/data/**,\
  **/reference/**,\
  **/scripts/**,\
  **/docs/**,\
  **/*.d.ts

# Code Quality Settings
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true

# Test Results (if using Jest with junit reporter)
# sonar.testExecutionReportPaths=test-results/jest-junit.xml

# Duplication Configuration
sonar.cpd.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/dto/**,\
  **/interfaces/**,\
  **/models/**

# Additional TypeScript Settings
sonar.typescript.tsconfigPath=tsconfig.json